{% extends "base.html" %}
{% block conteudo %}
<h1>Finalizar pedido</h1>
<p>{{ itens|length }} item(ns) — total <strong>{{ total|brl }}</strong></p>
<form method="post" class="form">
  <label>Endereço de entrega <input name="endereco" minlength="10" required></label>
  <label>Pagamento
    <select name="pagamento" required>
      {% for k, v in PAGAMENTOS.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}
    </select>
  </label>
  <p class="aviso">Pagamento simulado: nenhuma cobrança real é feita.</p>
  <button>Confirmar pedido</button>
</form>
{% endblock %}
